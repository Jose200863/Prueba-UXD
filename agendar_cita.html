<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda tu Cita Rápido - COSEVI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cosevi-yellow: #FFD84D;
            --cosevi-dark: #1A1A1A;
            --cosevi-blue: #0088FF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f8f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            padding: 0;
            background-color: white;
            flex-grow: 1;
        }

        .navbar-top-yellow {
            background-color: var(--cosevi-yellow) !important;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: none;
        }

        .navbar-brand .logo-img {
            width: 45px;
            height: 45px;
            border: 4px solid var(--cosevi-dark);
            padding: 5px;
            border-radius: 0.5rem;
            margin-right: 0.75rem;
            object-fit: contain;
        }

        .navbar-title-cosevi {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--cosevi-dark);
            margin-right: 0;
        }

        .navbar-title-page {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--cosevi-dark);
            text-align: center;
            flex-grow: 1;
        }

        .main-heading {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--cosevi-dark);
            margin-bottom: 0.5rem;
        }

        .main-subtitle {
            font-size: 1.75rem;
            font-weight: 500;
            color: var(--cosevi-dark);
            margin-bottom: 4rem;
        }

        .appointment-card {
            border: 2px solid var(--cosevi-dark);
            border-radius: 1rem;
            padding: 1.5rem;
            background-color: white;
            transition: box-shadow 0.3s ease;
        }

        .appointment-card:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .card-icon-img {
            width: 70px;
            height: 70px;
            margin-bottom: 1rem;
        }

        .car-moto-icons img {
            width: 40px;
            height: 40px;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .card-title-cosevi {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--cosevi-dark);
            margin-bottom: 0;
        }

        .card-text-cosevi {
            font-size: 1rem;
            color: var(--cosevi-dark);
            opacity: 0.7;
            margin-bottom: 1.5rem;
        }

        .btn-agenda {
            background-color: var(--cosevi-dark);
            color: var(--cosevi-yellow);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background-color 0.2s, color 0.2s;
            border: none;
        }

        .btn-agenda:hover {
            background-color: #333333;
            color: var(--cosevi-yellow);
        }

        .right-image-container img {
            width: 100%;
            height: auto;
            max-width: 100%;
            border-radius: 1rem;
            object-fit: cover;
        }

        .footer-custom {
            background-color: var(--cosevi-dark);
            color: white;
        }

        .footer-link {
            color: #ffffff;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .footer-link:hover {
            color: var(--cosevi-yellow);
        }

        .footer-logo-text {
            line-height: 1.2;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>

<body>

    <div class="container-fluid p-0 main-container">

        <nav class="navbar navbar-top-yellow shadow-sm">
            <div class="container-xl d-flex align-items-center justify-content-between">

                <div class="d-flex align-items-center navbar-brand">
                    <img src="imagenes/Captura de pantalla 2025-11-08 163208 (1).png" alt="Logo COSEVI" width="50"
                        height="50" class="me-2">
                    <span class="navbar-title-cosevi">COSEVI</span>
                </div>

                <h1 class="navbar-title-page m-0 me-md-5">AGENDA TU CITA RÁPIDO</h1>
            </div>
        </nav>

        <main class="container-xl py-5">
            <div class="row mb-5">
                <div class="col-12">
                    <p class="main-subtitle text-start text-md-center">
                        Elige el tipo de prueba para continuar el proceso
                    </p>
                </div>
            </div>

            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">

                    <div class="appointment-card mb-4 shadow-md">
                        <div class="row g-3 align-items-center">

                            <div class="col-md-5">
                                <div class="d-flex flex-column align-items-start">
                                    <div class="car-moto-icons d-flex">
                                        <img src="imagenes/carro.png" alt="Icono Carro" width="40" height="40"
                                            class="me-2">
                                        <img src="imagenes/bicicleta.png" alt="Icono Moto" width="40" height="40">
                                    </div>
                                    <h2 class="card-title-cosevi mt-2">Prueba Manejo</h2>
                                </div>
                            </div>

                            <div class="col-md-7 text-start">
                                <p class="card-text-cosevi">Ingresa al formulario aquí</p>
                                <a href="formulario1.html" class="btn btn-agenda">AGENDAR TU CITA</a>
                            </div>
                        </div>
                    </div>

                    <div class="appointment-card shadow-md">
                        <div class="row g-3 align-items-center">

                            <div class="col-md-5">
                                <div class="d-flex flex-column align-items-start">
                                    <img src="imagenes/contrato.png" alt="Icono Examen" class="card-icon-img">
                                    <h2 class="card-title-cosevi">Prueba Teórica</h2>
                                </div>
                            </div>

                            <div class="col-md-7 text-start">
                                <p class="card-text-cosevi">Ingresa al formulario aquí</p>
                                <a href="formulario_teorica.html" class="btn btn-agenda">AGENDAR TU CITA</a>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="col-lg-5 col-md-6 d-flex justify-content-center right-image-container">
                    <img src="imagenes/Imagen realistica de persona manejando auto con las dos manos (1).jpg"
                        alt="Persona manejando un auto" class="img-fluid rounded-lg shadow-lg">
                </div>

            </div>
        </main>

        <footer class="footer-custom mt-5 py-4">
            <div class="container-xl">
                <div class="row align-items-center">

                    <div class="col-md-5 d-flex align-items-center mb-3 mb-md-0">
                        <img src="imagenes/Gemini_Generated_Image_6nr49p6nr49p6nr4 (1).png" alt="Logo COSEVI" width="40"
                            height="40" class="me-2">

                        <p class="text-white footer-logo-text m-0">
                            <span class="fw-bold">Consejo de Seguridad Vial</span> <br> COSEVI
                        </p>
                    </div>

                    <div class="col-md-7">
                        <div class="d-flex flex-column flex-md-row justify-content-md-end align-items-center">
                            <a href="ayuda_contacto.html" class="footer-link mx-2 my-1 text-decoration-none">Preguntas
                                Frecuentes</a>
                            <a href="informacion.html" class="footer-link mx-2 my-1 text-decoration-none">Requisitos de
                                Prueba</a>
                            <a href="login_cosevi.html"
                                class="footer-link mx-2 my-1 text-decoration-none d-flex align-items-center">
                                Regístrate o Ingresa
                                <img src="imagenes/cuenta (1).png" alt="Icono Cuenta" width="40" height="40"
                                    class="ms-2">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
