<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - COSEVI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --cosevi-yellow: #FFD84D;
            --cosevi-dark: #1A1A1A;
            --cosevi-blue: #0088FF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f8f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background-color: white;
            border-radius: 1.5rem;
            border: 2px solid var(--cosevi-blue);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
        }

        .card-title-cosevi {
            font-weight: 800;
            color: var(--cosevi-dark);
            font-size: 2rem;
        }

        .card-subtitle-cosevi {
            font-weight: 500;
            color: #555;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: 2px solid var(--cosevi-dark);
            transition: all 0.2s;
            text-align: center;
            border-radius: 0;
            text-transform: uppercase;
        }

        .auth-tab-inactive {
            background-color: transparent;
            color: var(--cosevi-dark);
        }

        .auth-tab-active {
            background-color: var(--cosevi-dark);
            color: white;
            border-color: var(--cosevi-dark);
        }

        #login-tab {
            border-top-left-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
            border-right: none;
        }

        #register-tab {
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            border-left: none;
        }

        #login-tab.auth-tab-active {
            border-right: 2px solid var(--cosevi-dark);
        }

        .input-group-text {
            background-color: #f7f7f7;
            border-right: none;
            border-radius: 0.5rem 0 0 0.5rem;
            padding-right: 0.5rem;
        }

        .form-control {
            border-radius: 0 0.5rem 0.5rem 0;
            border-left: none;
        }

        .input-group {
            border: 1px solid #ced4da;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .btn-main-action {
            background-color: var(--cosevi-dark);
            color: white;
            font-weight: 800;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            transition: background-color 0.2s;
            width: 100%;
            text-transform: uppercase;
            margin-top: 1.5rem;
        }

        .btn-main-action:hover {
            background-color: #333333;
            color: white;
        }

        .forgot-password-link {
            color: var(--cosevi-blue);
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .d-none {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="auth-card text-center">
        <div class="header-content d-block text-center pb-3">
            <div class="d-flex flex-column align-items-center mb-3">
                <img src="imagenes/Captura de pantalla 2025-11-08 163208 (1).png" alt="Logo COSEVI" width="50" height="50" class="mb-2">
                <span class="fs-2 fw-bold text-dark">COSEVI</span>
            </div>

            <h1 class="card-title-cosevi">Bienvenido(a) a COSEVI</h1>
            <p class="card-subtitle-cosevi">Inicie sesión o Regístrese para gestionar sus citas y resultados</p>
        </div>

        <div class="body-content">
            <div class="d-flex mb-4">
                <button id="login-tab" class="auth-tab auth-tab-active" onclick="toggleAuthMode(false)">INICIAR SESIÓN</button>
                <button id="register-tab" class="auth-tab auth-tab-inactive" onclick="toggleAuthMode(true)">REGISTRARSE</button>
            </div>

            <form id="authForm">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="text" class="form-control" placeholder="Cédula o Número de Identificación" id="authId" required>
                </div>

                <div class="input-group mb-3 d-none" id="auth-email-field">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="Correo Electrónico" id="authEmail">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Contraseña" id="authPassword" required>
                    <span class="input-group-text bg-white" style="border-left: none; cursor: pointer;" onclick="togglePasswordVisibility('authPassword')">
                        <i class="bi bi-eye" id="eye-icon-authPassword"></i>
                    </span>
                </div>

                <div class="input-group mb-3 d-none" id="confirm-password-field">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" placeholder="Confirmar Contraseña" id="authConfirmPassword">
                    <span class="input-group-text bg-white" style="border-left: none; cursor: pointer;" onclick="togglePasswordVisibility('authConfirmPassword')">
                        <i class="bi bi-eye" id="eye-icon-authConfirmPassword"></i>
                    </span>
                </div>

                <div class="text-start mb-4" id="forgot-password-link-container">
                    <a href="#" class="forgot-password-link text-decoration-none">¿Olvidó su contraseña?</a>
                </div>

                <button type="submit" class="btn btn-main-action" id="mainActionButton">INICIAR SESIÓN</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <script>
        let isRegisterMode = false;

        function toggleAuthMode(isRegister) {
            isRegisterMode = isRegister;

            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const authEmailField = document.getElementById('auth-email-field');
            const confirmPasswordField = document.getElementById('confirm-password-field');
            const forgotPasswordContainer = document.getElementById('forgot-password-link-container');
            const mainActionButton = document.getElementById('mainActionButton');
            const authEmailInput = document.getElementById('authEmail');
            const authConfirmPasswordInput = document.getElementById('authConfirmPassword');
            const authIdInput = document.getElementById('authId');
            const authPasswordInput = document.getElementById('authPassword');

            if (isRegister) {
                loginTab.classList.remove('auth-tab-active');
                loginTab.classList.add('auth-tab-inactive');
                registerTab.classList.remove('auth-tab-inactive');
                registerTab.classList.add('auth-tab-active');

                authEmailField.classList.remove('d-none');
                confirmPasswordField.classList.remove('d-none');
                forgotPasswordContainer.classList.add('d-none');

                mainActionButton.textContent = 'REGISTRARSE';

                authEmailInput.required = true;
                authConfirmPasswordInput.required = true;
                authIdInput.required = true;
                authPasswordInput.required = true;

            } else {
                loginTab.classList.remove('auth-tab-inactive');
                loginTab.classList.add('auth-tab-active');
                registerTab.classList.remove('auth-tab-active');
                registerTab.classList.add('auth-tab-inactive');

                authEmailField.classList.add('d-none');
                confirmPasswordField.classList.add('d-none');
                forgotPasswordContainer.classList.remove('d-none');

                mainActionButton.textContent = 'INICIAR SESIÓN';

                authEmailInput.required = false;
                authConfirmPasswordInput.required = false;
                authEmailInput.value = '';
                authConfirmPasswordInput.value = '';

                authIdInput.required = true;
                authPasswordInput.required = true;
            }
        }

        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById('eye-icon-' + id);

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            if (mode === 'register') {
                toggleAuthMode(true);
            } else {
                toggleAuthMode(false);
            }
        });

        document.getElementById('authForm').addEventListener('submit', function (e) {
            e.preventDefault();

            if (isRegisterMode) {
                const pass = document.getElementById('authPassword').value;
                const confirmPass = document.getElementById('authConfirmPassword').value;

                if (pass !== confirmPass) {
                    alert("Error: Las contraseñas no coinciden.");
                    return;
                }

            }

            alert(`Acción simulada exitosa. Redirigiendo a Mi Cuenta...`);
            window.location.href = 'mi_cuenta.html';
        });
    </script>

</body>

</html>
