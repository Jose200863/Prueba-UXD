<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Datos Personales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Variables de Color COSEVI */
        :root {
            --cosevi-yellow: #FFD84D;
            --cosevi-dark: #1A1A1A;
            --cosevi-blue-btn: #0088FF;
            --cosevi-text-gray: #495057;
            --cosevi-border-gray: #ced4da;
            --cosevi-light-gray: #f8f8f8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cosevi-light-gray);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor principal de la tarjeta del formulario */
        .main-card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        /* Banner Superior - Agende su cita */
        .top-banner {
            background-color: var(--cosevi-yellow);
            padding: 1.5rem 2rem;
            color: var(--cosevi-dark);
            display: flex;
            align-items: center;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .top-banner img {
            height: 35px;
            margin-right: 0.75rem;
        }

        /* Banner de Pasos */
        .steps-banner {
            background-color: var(--cosevi-yellow);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--cosevi-dark);
        }

        /* Línea de progreso (estilo personalizado) */
        .steps-banner::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 10rem);
            height: 4px;
            background-color: var(--cosevi-dark);
            z-index: 1;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .step-icon-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--cosevi-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 1.3rem;
            border: 2px solid var(--cosevi-dark);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Estilo para el paso INACTIVO (borde oscuro, fondo claro) */
        .step-icon-circle.inactive {
            background-color: transparent;
            color: var(--cosevi-dark);
            border: 2px solid var(--cosevi-dark);
        }

        .step-item.active .step-icon-circle {
            background-color: white;
            color: var(--cosevi-dark);
            border-color: var(--cosevi-dark);
        }

        .step-item.active .step-label {
            color: var(--cosevi-dark);
        }

        /* Contenido del Formulario */
        .form-content {
            padding: 2.5rem;
            display: flex;
            gap: 2rem;
        }

        .form-section {
            flex: 1;
        }

        .form-label-cosevi {
            font-weight: 600;
            color: var(--cosevi-text-gray);
            margin-bottom: 0.5rem;
        }

        /* Estilos para inputs */
        .form-control-cosevi,
        .form-control {
            border: 1px solid var(--cosevi-border-gray);
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control-cosevi:focus,
        .form-control:focus,
        .form-select-cosevi:focus,
        .form-select:focus {
            border-color: var(--cosevi-blue-btn);
            box-shadow: 0 0 0 0.2rem rgba(0, 136, 255, 0.25);
            outline: none;
        }

        .form-select-cosevi {
            border: 1px solid var(--cosevi-border-gray);
            border-radius: 0.375rem;
            padding: 0.75rem 2.5rem 0.75rem 1rem;
            font-size: 1rem;
            width: 100%;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23343a40' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .form-image-container {
            flex-shrink: 0;
            width: 300px;
            max-width: 40%;
            height: auto;
            object-fit: cover;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .form-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn-cosevi-blue {
            background-color: var(--cosevi-blue-btn);
            color: white;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-cosevi-blue:hover {
            background-color: #006ddb;
            color: white;
        }

        @media (max-width: 768px) {
            .form-content {
                flex-direction: column;
            }

            .form-image-container {
                width: 100%;
                max-width: 100%;
                height: 200px;
                margin-top: 2rem;
            }

            .steps-banner::before {
                width: calc(100% - 4rem);
            }

            .step-item {
                font-size: 0.8rem;
            }

            .step-icon-circle {
                width: 35px;
                height: 35px;
                font-size: 1rem;
                margin-bottom: 0.25rem;
            }
        }

        @media (max-width: 576px) {
            .steps-banner {
                padding: 1rem;
            }

            .step-item {
                font-size: 0.7rem;
            }

            .step-icon-circle {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
                margin-bottom: 0.25rem;
            }

            .top-banner {
                font-size: 1.1rem;
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="main-card">

        <div class="top-banner">
            <img src="imagenes/Captura de pantalla 2025-11-08 163208 (1).png" alt="Logo COSEVI">
            <span>Agende su cita en línea en solo 5 pasos</span>
        </div>

        <div class="steps-banner">

            <div class="step-item active">
                <div class="step-icon-circle">
                    <img src="imagenes/usuario (5).png" alt="Datos Personales"
                        style="width: 24px; height: 24px; filter: invert(1);">
                </div>
                <span class="step-label">Datos Personales</span>
            </div>

            <div class="step-item">
                <div class="step-icon-circle inactive">
                    <img src="imagenes/fecha-limite (1).png" alt="Fecha y Lugar" style="width: 24px; height: 24px;">
                </div>
                <span class="step-label">Fecha y Lugar</span>
            </div>

            <div class="step-item">
                <div class="step-icon-circle inactive">
                    <img src="imagenes/placa (1).png" alt="Paso 3" style="width: 24px; height: 24px;">
                </div>
                <span class="step-label">Verificación</span>
            </div>

            <div class="step-item">
                <div class="step-icon-circle inactive">
                    <img src="imagenes/ingresos.png" alt="Pago" style="width: 24px; height: 24px;">
                </div>
                <span class="step-label">Pago</span>
            </div>

            <div class="step-item">
                <div class="step-icon-circle inactive">
                    <img src="imagenes/comprobar.png" alt="Confirmación" style="width: 24px; height: 24px;">
                </div>
                <span class="step-label">Confirmación</span>
            </div>

        </div>

        <div class="form-content">
            <div class="form-section">
                <p class="h5 mb-4 text-secondary font-weight-normal">
                    Por favor verifique toda su información antes de continuar el proceso
                </p>

                <form>
                    <div class="mb-3">
                        <label for="identificacion" class="form-label form-label-cosevi">Identificación:</label>
                        <input type="text" class="form-control form-control-cosevi" id="identificacion"
                            placeholder="Ingrese su identificación">
                    </div>
                    <div class="mb-3">
                        <label for="nombreCompleto" class="form-label form-label-cosevi">Nombre Completo:</label>
                        <input type="text" class="form-control form-control-cosevi" id="nombreCompleto"
                            placeholder="Ingrese su nombre completo">
                    </div>
                    <div class="mb-4">
                        <label for="tipoPrueba" class="form-label form-label-cosevi">Tipo de Prueba:</label>
                        <select class="form-select form-select-cosevi" id="tipoPrueba">
                            <option value="" selected disabled>Seleccione el tipo de prueba</option>
                            <option value="manejo">Prueba de Manejo</option>
                            <option value="teorica">Prueba Teórica</option>
                        </select>
                    </div>

                    <div class="text-center text-md-left">
                        <a href="formulario2.html" class="text-decoration-none">
                            <button type="button" class="btn btn-cosevi-blue">Continuar</button>
                        </a>
                    </div>
                </form>
            </div>

            <div class="form-image-container d-none d-md-block">
                <img src="imagenes/Captura de pantalla 2025-11-11 175011.png" alt="Hombre trabajando en computadora">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
